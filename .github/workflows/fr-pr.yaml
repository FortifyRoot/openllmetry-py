name: FR PR Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fr-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fail on hardcoded provider API keys
        shell: bash
        run: |
          set -euo pipefail

          regex='(sk-(proj-)?[A-Za-z0-9_-]{20,}|sk-or-v1-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9_-]{20,}|OPENAI_API_KEY[[:space:]]*[:=][[:space:]]*["'"'"']?sk-|OPENROUTER_API_KEY[[:space:]]*[:=][[:space:]]*["'"'"']?sk-or-|ANTHROPIC_API_KEY[[:space:]]*[:=][[:space:]]*["'"'"']?sk-ant-)'

          if git grep -nI -E "$regex" -- . ':(exclude)*.lock'; then
            echo "::error::Potential hardcoded provider key detected. Remove it and use placeholders or GitHub Secrets."
            exit 1
          fi

          echo "No hardcoded provider key patterns detected."

  fr-tests:
    needs: secret-scan
    name: FR Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run FR-marked test suite
        env:
          HAYSTACK_TELEMETRY_ENABLED: "False"
        run: bash ./scripts/run-tests.sh --fr

      - name: Upload FR test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-test-reports-py${{ matrix.python-version }}
          path: reports/test-run/
          if-no-files-found: ignore

  non-fr-tests:
    needs: secret-scan
    name: Non-FR Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run non-FR test suite (upstream UT + VCR)
        env:
          HAYSTACK_TELEMETRY_ENABLED: "False"
        run: bash ./scripts/run-tests.sh -- -m "not fr"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-fr-test-reports-py${{ matrix.python-version }}
          path: reports/test-run/
          if-no-files-found: ignore
